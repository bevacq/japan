<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giappone – Idee e voti</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--text:#222;--muted:#777;--line:#e6e0d6;--accent:#c0392b;--up:#2e8b57;--down:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#1b1a19;--card:#262524;--text:#eee;--muted:#9a9a9a;--line:#3a3836;--accent:#e8675a;--up:#4fc98a;--down:#e8675a}}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,"Segoe UI",sans-serif;max-width:640px;padding:16px}
h1{font-size:22px;margin:4px 0 12px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:20px;font-size:14px;white-space:nowrap}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:16px;display:grid;gap:8px}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px;width:100%}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px;font-size:15px;font-weight:600}
h2{font-size:16px;margin:18px 0 8px;color:var(--accent)}
.idea{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.idea b{display:block;font-size:16px}
.note{color:var(--muted);font-size:13px;margin:4px 0;overflow-wrap:anywhere}
.row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.v{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:7px 12px;font-size:15px}
.v.up.on{background:var(--up);color:#fff;border-color:var(--up)}
.v.down.on{background:var(--down);color:#fff;border-color:var(--down)}
.score{margin-left:auto;font-weight:700}
.del{background:none;border:0;color:var(--muted);font-size:12px}
.msg{color:var(--muted);text-align:center;padding:20px}
.who{color:var(--muted);font-size:12px;margin:0 0 10px}
.who button{background:none;border:0;color:var(--accent);font-size:12px;padding:0}
</style>
</head>
<body>
<h1>🇯🇵 Giappone – cosa facciamo?</h1>
<div class="who" id="who"></div>
<div class="tabs" id="tabs"></div>
<div class="form">
  <input id="t" placeholder="Attività (es. TeamLab Planets)" maxlength="80">
  <select id="c"><option>Tokyo</option><option>Osaka</option><option>Kyoto</option></select>
  <textarea id="n" rows="2" placeholder="Note o link (facoltativo)" maxlength="300"></textarea>
  <button class="btn" id="add">Aggiungi idea</button>
</div>
<div id="list"><div class="msg">Caricamento…</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, onSnapshot, addDoc, setDoc, deleteDoc, doc }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 1) INCOLLA QUI LA TUA CONFIGURAZIONE FIREBASE */
const firebaseConfig = {
  apiKey: "INCOLLA",
  authDomain: "INCOLLA",
  projectId: "INCOLLA",
  storageBucket: "INCOLLA",
  messagingSenderId: "INCOLLA",
  appId: "INCOLLA"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const CITIES = ["Tokyo", "Osaka", "Kyoto"];
let ideas = [], votes = [], filter = "Tutte";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// Identità: nome scelto al primo accesso + id casuale, salvati sul dispositivo
let uid = localStorage.getItem("uid");
if (!uid) { uid = crypto.randomUUID(); localStorage.setItem("uid", uid); }
let myName = localStorage.getItem("name");
function askName() {
  const n = (prompt("Come ti chiami?", myName || "") || "").trim();
  if (n) { myName = n; localStorage.setItem("name", n); }
  renderWho();
}
if (!myName) askName();
function renderWho() {
  $("who").innerHTML = `Sei <b>${esc(myName || "anonimo")}</b> · <button id="chg">cambia nome</button>`;
  $("chg").onclick = askName;
}
renderWho();

function tabs() {
  $("tabs").innerHTML = ["Tutte", ...CITIES].map(c => `<button class="tab ${c === filter ? "on" : ""}" data-c="${c}">${c}</button>`).join("");
  $("tabs").querySelectorAll(".tab").forEach(b => b.onclick = () => { filter = b.dataset.c; tabs(); render(); });
}
const score = id => votes.filter(v => v.ideaId === id).reduce((s, v) => s + v.v, 0);
const myVote = id => (votes.find(v => v.ideaId === id && v.uid === uid) || {}).v || 0;
const count = (id, val) => votes.filter(v => v.ideaId === id && v.v === val).length;

function render() {
  const cs = filter === "Tutte" ? CITIES : [filter];
  let html = "";
  for (const c of cs) {
    const list = ideas.filter(i => i.city === c).sort((a, b) => score(b.id) - score(a.id) || a.createdAt - b.createdAt);
    html += `<h2>${c} (${list.length})</h2>`;
    if (!list.length) html += `<div class="msg">Nessuna idea ancora</div>`;
    for (const i of list) {
      const mv = myVote(i.id), sc = score(i.id);
      html += `<div class="idea"><b>${esc(i.title)}</b>
        ${i.note ? `<div class="note">${esc(i.note)}</div>` : ""}
        <div class="note">Proposta da ${esc(i.byName || "qualcuno")}</div>
        <div class="row">
          <button class="v up ${mv === 1 ? "on" : ""}" data-id="${i.id}" data-v="1">👍 ${count(i.id, 1)}</button>
          <button class="v down ${mv === -1 ? "on" : ""}" data-id="${i.id}" data-v="-1">👎 ${count(i.id, -1)}</button>
          <span class="score">${sc > 0 ? "+" : ""}${sc}</span>
          ${i.by === uid ? `<button class="del" data-del="${i.id}">elimina</button>` : ""}
        </div></div>`;
    }
  }
  $("list").innerHTML = html;
  $("list").querySelectorAll(".v").forEach(b => b.onclick = () => vote(b.dataset.id, +b.dataset.v));
  $("list").querySelectorAll("[data-del]").forEach(b => b.onclick = () => delIdea(b.dataset.del));
}

async function vote(id, val) {
  const ref = doc(db, "votes", id + "__" + uid);
  try {
    if (myVote(id) === val) await deleteDoc(ref);
    else await setDoc(ref, { ideaId: id, uid, v: val, name: myName || "" });
  } catch (e) { console.error(e); }
}
async function delIdea(id) {
  if (!confirm("Eliminare questa idea?")) return;
  try {
    await deleteDoc(doc(db, "ideas", id));
    for (const v of votes.filter(v => v.ideaId === id)) await deleteDoc(doc(db, "votes", id + "__" + v.uid));
  } catch (e) { console.error(e); }
}

$("add").onclick = async () => {
  const title = $("t").value.trim();
  if (!title) return;
  if (!myName) askName();
  const btn = $("add"); btn.disabled = true;
  try {
    await addDoc(collection(db, "ideas"), {
      title, city: $("c").value, note: $("n").value.trim(),
      by: uid, byName: myName || "", createdAt: Date.now()
    });
    $("t").value = ""; $("n").value = "";
  } catch (e) { alert("Salvataggio non riuscito. Controlla config e regole Firebase."); console.error(e); }
  btn.disabled = false;
};

onSnapshot(collection(db, "ideas"),
  s => { ideas = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); },
  () => { $("list").innerHTML = '<div class="msg">Impossibile leggere i dati: controlla config e regole Firebase.</div>'; });
onSnapshot(collection(db, "votes"), s => { votes = s.docs.map(d => d.data()); render(); });

tabs();
</script>
</body>
</html>
